<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>App — Promoções</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#0E1A2B}
a{color:#2457C5}a:hover{color:#163A8A}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.disp{font-family:'Bricolage Grotesque','IBM Plex Sans',sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A1322; border-radius: 44px">

<svg viewBox="0 0 390 340" style="position: absolute; left: 0; top: 0; width: 390px; height: 340px" role="img" aria-label="Aeroportos com promoção em andamento">
<defs><pattern id="pontos3" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1C2A42"/></pattern></defs>
<rect width="390" height="340" fill="url(#pontos3)"/>
<g fill="#F07B3F"><circle cx="316" cy="189" r="14" fill-opacity="0.2"/><circle cx="316" cy="189" r="6"/><circle cx="247" cy="298" r="16" fill-opacity="0.2"/><circle cx="247" cy="298" r="6"/><circle cx="316" cy="92" r="11" fill-opacity="0.2"/><circle cx="316" cy="92" r="5"/><circle cx="225" cy="270" r="11" fill-opacity="0.2"/><circle cx="225" cy="270" r="5"/></g>
<g fill="#6F93D9"><circle cx="276" cy="293" r="4"/><circle cx="235" cy="219" r="4"/><circle cx="347" cy="138" r="4"/><circle cx="130" cy="85" r="4"/><circle cx="230" cy="67" r="4"/><circle cx="206" cy="317" r="4"/><circle cx="270" cy="258" r="4"/></g>
<g font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" fill="#DCE3EE"><text x="328" y="193">SSA</text><text x="190" y="303">GRU</text><text x="326" y="96">FOR</text><text x="188" y="274">VCP</text></g>
</svg>

<div style="position: absolute; left: 20px; top: 56px; color: #FFFFFF; display: flex; flex-direction: column; gap: 4px">
<span class="mono" style="font-size: 34px; font-weight: 600; line-height: 1">2</span>
<span style="font-size: 13px; color: #C3CDDB; max-width: 150px; line-height: 1.35">companhias em promoção agora</span>
</div>

<section aria-labelledby="promo-h" style="position: absolute; left: 0; right: 0; top: 318px; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 44px 44px; padding: 10px 18px 0; display: flex; flex-direction: column; gap: 12px">
<div style="width: 40px; height: 5px; border-radius: 99px; background: #D5DAE1; align-self: center"></div>
<h1 id="promo-h" class="disp" style="margin: 0; font-size: 32px; font-weight: 700">Promoções</h1>
<div style="display: flex; gap: 4px; align-items: center; overflow: hidden" role="group" aria-label="Filtro">
<button style="flex: 0 0 auto; height: 40px; padding: 0 12px; border: 0; background: transparent; font: inherit; font-weight: 600; color: #0E1A2B">Agora ▾</button>
<button aria-pressed="true" style="flex: 0 0 auto; height: 40px; padding: 0 14px; border-radius: 99px; border: 0; background: #EEF0F3; font: inherit; font-weight: 600; color: #0E1A2B">Todas</button>
<button style="flex: 0 0 auto; height: 40px; padding: 0 12px; border: 0; background: transparent; font: inherit; color: #3B4759">Nacionais</button>
<button style="flex: 0 0 auto; height: 40px; padding: 0 12px; border: 0; background: transparent; font: inherit; color: #3B4759">Internacionais</button>
</div>

<div>
<div style="font-weight: 600; font-size: 15px">Para você</div>
<div style="font-size: 13px; color: #556274">Promoções nas rotas dos seus alertas</div>
</div>

<sc-for list="{{agora}}" as="p" hint-placeholder-count="2">
<a href="AppRota.dc.html" style="display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; padding: 4px 0 12px; border-bottom: 1px solid #EEF0F3; text-decoration: none; color: #0E1A2B">
<div style="width: 48px; height: 48px; border-radius: 99px; background: #FCE8DC; display: flex; align-items: center; justify-content: center"><span style="width: 14px; height: 14px; border-radius: 99px; background: #D9581C"></span></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 17px; font-weight: 600">{{p.cia}}</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<div><div style="font-size: 10px; letter-spacing: 0.06em; font-weight: 600; color: #556274">DESCONTO</div><div class="mono" style="font-size: 15px; font-weight: 600; color: #B5410F">{{p.desconto}}</div></div>
<div><div style="font-size: 10px; letter-spacing: 0.06em; font-weight: 600; color: #556274">ROTAS</div><div class="mono" style="font-size: 15px; font-weight: 600">{{p.rotas}}</div></div>
<div><div style="font-size: 10px; letter-spacing: 0.06em; font-weight: 600; color: #556274">DESDE</div><div class="mono" style="font-size: 15px; font-weight: 600">{{p.desde}}</div></div>
</div>
</div>
</a>
</sc-for>

<div style="font-weight: 600; font-size: 15px">Encerradas recentemente</div>
<div style="display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; opacity: 0.8">
<div style="width: 48px; height: 48px; border-radius: 99px; background: #EEF0F3; display: flex; align-items: center; justify-content: center"><span style="width: 14px; height: 14px; border-radius: 99px; background: #8A96A8"></span></div>
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 17px; font-weight: 600">TAP</span><span class="mono" style="font-size: 14px; color: #3B4759">−28% · 22–26 set</span></div>
</div>
</section>

<nav aria-label="Seções" style="position: absolute; left: 16px; bottom: 22px; display: flex; gap: 10px; align-items: center">
<div style="display: flex; background: #FFFFFFF0; border: 1px solid #E1E4E8; border-radius: 99px; padding: 4px; box-shadow: 0 6px 20px #0A132226">
<a href="AppMapa.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; width: 84px; padding: 6px 0; border-radius: 99px; color: #3B4759; text-decoration: none; font-size: 11px; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/></svg>Rotas</a>
<a href="AppPromocoes.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; width: 84px; padding: 6px 0; border-radius: 99px; background: #EEF0F3; color: #0E1A2B; text-decoration: none; font-size: 11px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>Promoções</a>
<a href="Alertas.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; width: 84px; padding: 6px 0; border-radius: 99px; color: #3B4759; text-decoration: none; font-size: 11px; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>Alertas</a>
</div>
<button aria-label="Buscar rota" style="width: 58px; height: 58px; border-radius: 99px; border: 1px solid #E1E4E8; background: #FFFFFFF0; box-shadow: 0 6px 20px #0A132226; display: flex; align-items: center; justify-content: center; color: #2457C5"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      agora: [
        { cia: 'LATAM', desconto: '−31%', rotas: '14', desde: '05 out' },
        { cia: 'Azul', desconto: '−24%', rotas: '9', desde: '06 out' }
      ]
    };
  }
}
</script>
</body>
</html>
