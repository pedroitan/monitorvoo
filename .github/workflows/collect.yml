name: collect

on:
  schedule:
    # 2x ao dia: 07h, 19h horario de Brasilia (UTC-3)
    - cron: "0 10,22 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r collectors/requirements.txt

      - name: Run collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COLLECT_DELAY_MIN: 5
          COLLECT_DELAY_MAX: 15
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
        run: python -m collectors.collect --priority 1

      - name: Detect promos
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m collectors.detect

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh issue create
          --title "Coleta falhou — $(date -u +'%F %T') UTC"
          --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --label coleta || true
