<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>App — Rota Salvador → Lisboa</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#0E1A2B}
a{color:#2457C5}a:hover{color:#163A8A}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.disp{font-family:'Bricolage Grotesque','IBM Plex Sans',sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A1322; border-radius: 44px">

<svg viewBox="0 0 390 340" style="position: absolute; left: 0; top: 0; width: 390px; height: 340px" aria-hidden="true">
<defs><pattern id="pontos2" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1C2A42"/></pattern></defs>
<rect width="390" height="340" fill="url(#pontos2)"/>
<path d="M58 296 Q150 90 336 118" fill="none" stroke="#F07B3F" stroke-width="3" stroke-linecap="round"/>
<path d="M58 296 Q150 90 336 118" fill="none" stroke="#F07B3F" stroke-width="10" stroke-opacity="0.15" stroke-linecap="round"/>
<circle cx="58" cy="296" r="6" fill="#FFFFFF"/><circle cx="336" cy="118" r="6" fill="#FFFFFF"/>
<text x="72" y="300" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600" fill="#DCE3EE">SSA</text>
<text x="300" y="146" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600" fill="#DCE3EE">LIS</text>
</svg>

<a href="AppMapa.dc.html" aria-label="Voltar" style="position: absolute; left: 16px; top: 52px; width: 44px; height: 44px; border-radius: 99px; background: #16223A; display: flex; align-items: center; justify-content: center; color: #FFFFFF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<button aria-label="Compartilhar" style="position: absolute; right: 16px; top: 52px; width: 44px; height: 44px; border-radius: 99px; border: 0; background: #16223A; display: flex; align-items: center; justify-content: center; color: #FFFFFF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v13"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>

<div style="position: absolute; left: 20px; top: 172px; display: flex; flex-direction: column; gap: 6px; color: #FFFFFF">
<span style="align-self: flex-start; background: #F07B3F; color: #0A1322; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px">Bom momento para comprar</span>
<span class="mono" style="font-size: 40px; font-weight: 600; line-height: 1">R$ 2.960</span>
<span style="font-size: 13px; color: #C3CDDB">LATAM · ida e volta · 60 dias antes</span>
</div>

<section aria-labelledby="rota-h" style="position: absolute; left: 0; right: 0; top: 330px; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 44px 44px; padding: 10px 18px 0; display: flex; flex-direction: column; gap: 12px">
<div style="width: 40px; height: 5px; border-radius: 99px; background: #D5DAE1; align-self: center"></div>
<div>
<h1 id="rota-h" class="disp" style="margin: 0; font-size: 26px; font-weight: 700">Salvador → Lisboa</h1>
<p style="margin: 2px 0 0; font-size: 13px; color: #556274">20% abaixo da mediana de 28 dias · promoção LATAM desde 05 out</p>
</div>

<div style="display: flex; gap: 6px" role="group" aria-label="Antecedência">
<button style="flex: 1 1 0; height: 36px; border-radius: 10px; border: 0; background: #F2F3F0; font: inherit; font-size: 13px">14d</button>
<button style="flex: 1 1 0; height: 36px; border-radius: 10px; border: 0; background: #F2F3F0; font: inherit; font-size: 13px">30d</button>
<button aria-pressed="true" style="flex: 1 1 0; height: 36px; border-radius: 10px; border: 0; background: #0E1A2B; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600">60d</button>
<button style="flex: 1 1 0; height: 36px; border-radius: 10px; border: 0; background: #F2F3F0; font: inherit; font-size: 13px">90d</button>
<button style="flex: 1 1 0; height: 36px; border-radius: 10px; border: 0; background: #F2F3F0; font: inherit; font-size: 13px">180d</button>
</div>

<div style="position: relative; height: 118px">
<svg viewBox="0 0 1000 320" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 118px" role="img" aria-label="Menor preço por companhia nos últimos 30 dias">
<rect x="500" y="0" width="172" height="320" fill="#FBE3D4"/>
<rect x="914" y="0" width="86" height="320" fill="#FBE3D4"/>
<rect x="0" y="112" width="1000" height="56" fill="#DCE5F5"/>
<polyline fill="none" stroke="#7B3FB0" stroke-width="2" vector-effect="non-scaling-stroke" points="0,88 138,86 276,90 414,84 552,92 690,88 828,84 1000,92"/>
<polyline fill="none" stroke="#0B7A6C" stroke-width="2" vector-effect="non-scaling-stroke" points="0,148 138,146 276,145 414,146 483,148 517,232 552,240 621,230 655,150 793,144 931,148 1000,146"/>
<polyline fill="none" stroke="#2457C5" stroke-width="2.5" vector-effect="non-scaling-stroke" points="0,120 138,130 276,126 414,120 552,124 690,122 828,126 897,128 931,205 966,214 1000,218"/>
</svg>
</div>
<div class="mono" style="display: flex; justify-content: space-between; font-size: 11px; color: #556274; margin-top: -6px"><span>07 set</span><span>21 set</span><span>06 out</span></div>

<div style="display: flex; flex-direction: column">
<div style="display: grid; grid-template-columns: 1fr 74px 74px 58px; gap: 6px; font-size: 10px; letter-spacing: 0.06em; font-weight: 600; color: #556274; padding-bottom: 6px">
<span>COMPANHIA</span><span style="text-align: right">HOJE</span><span style="text-align: right">MEDIANA</span><span style="text-align: right">VS NORM.</span>
</div>
<sc-for list="{{cias}}" as="c" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: 1fr 74px 74px 58px; gap: 6px; align-items: center; padding: 9px 0; border-top: 1px solid #EEF0F3; font-size: 14px">
<span style="display: flex; align-items: center; gap: 8px; font-weight: 600"><span style="width: 10px; height: 10px; border-radius: 99px; background: {{c.cor}}"></span>{{c.nome}}</span>
<span class="mono" style="text-align: right; font-weight: 600">{{c.hoje}}</span>
<span class="mono" style="text-align: right; color: #3B4759">{{c.mediana}}</span>
<span class="mono" style="text-align: right; font-weight: 600; color: {{c.corDif}}">{{c.dif}}</span>
</div>
</sc-for>
</div>
</section>

<div style="position: absolute; left: 16px; right: 16px; bottom: 22px; display: flex; gap: 10px">
<a href="Alertas.dc.html" style="flex: 1 1 0; height: 56px; border-radius: 99px; background: #FFFFFF; border: 1px solid #D5DAE1; box-shadow: 0 6px 20px #0A132222; color: #0E1A2B; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-weight: 600; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>Criar alerta</a>
<a href="https://example.com" style="flex: 1 1 0; height: 56px; border-radius: 99px; background: #0E1A2B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-weight: 600; font-size: 16px">Ver na LATAM<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      cias: [
        { nome: 'LATAM', cor: '#2457C5', hoje: 'R$ 2.960', mediana: 'R$ 3.690', dif: '−20%', corDif: '#B5410F' },
        { nome: 'TAP', cor: '#0B7A6C', hoje: 'R$ 3.630', mediana: 'R$ 3.640', dif: '0%', corDif: '#3B4759' },
        { nome: 'Azul', cor: '#7B3FB0', hoje: 'R$ 4.140', mediana: 'R$ 4.180', dif: '−1%', corDif: '#3B4759' }
      ]
    };
  }
}
</script>
</body>
</html>
